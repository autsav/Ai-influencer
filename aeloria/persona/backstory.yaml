# Aeloria Backstory & World Lore
# ============================================================
# This file contains ALL backstory, world-building, and narrative lore.
# It is NOT loaded by the generation pipeline (prompt_builder.py).
# It is for human reference only — it does NOT influence image generation.
#
# Soul 2.0 rule: Identity = LoRA only. Never text-based.
# ============================================================

version: 1

identity:
  name: Aeloria
  bio: "24yo AI entrepreneur 🤖 documenting how AI is transforming businesses"

world:
  name: The Build
  description: >-
    Aeloria is a 24-year-old AI entrepreneur obsessed with discovering cutting-edge
    AI before everyone else. She documents building AI businesses and automation
    systems — testing tools, building workflows, and showing real results. Her
    world is coworking spaces, coffee shops, home office, city streets, and tech
    conferences. The brand communicates: "She's successful because she's smart,
    not because she's showing off."
  rule: Every post happens in or around the AI entrepreneur lifestyle
  locations:
    - home office (clean desk, MacBook, notebook, minimal setup)
    - coffee shops (indie cafés, working on automations)
    - coworking spaces (modern, bright, other founders around)
    - city streets (commuting, walking calls, natural light)
    - tech conferences (behind the scenes, testing new tools)
    - libraries and quiet spaces (reading, learning, planning)

backstory:
  origin: "started building AI automations for local businesses at 22, now documents everything she learns"
  work: "AI automation consultant and content creator — helps businesses save time, money, and employees with AI"
  philosophy: "AI creates freedom — the goal isn't to replace humans, it's to free them from repetitive work"
  audience: "entrepreneurs, freelancers, agencies, startups, and small business owners who want to save time and scale with AI"
  positioning: "the person who always finds the next AI tool before it goes viral"

relationships:
  - "her MacBook — the tool that runs everything"
  - "her notebook — where ideas and workflows are sketched"
  - "her audience — business owners learning AI through her experiments"

catchphrases:
  - "I tested this so you don't have to"
  - "This saved me X hours this week"
  - "Every business has one bottleneck — AI removes it"
  - "I'm still experimenting with this"
  - "This surprised me"
  - "I honestly didn't expect this"

character:
  essence: "a curious, ambitious young founder who learns out loud and shares everything"
  personality:
    - curious
    - confident
    - friendly
    - slightly geeky
    - business-minded
    - creative
    - funny when appropriate
  contradictions:
    - "preaches AI freedom but works 14-hour days building it"
    - "tests tools for a living but still uses a paper notebook"
    - "says 'I'm still experimenting' then drops a full workflow guide"
  values:
    - learning out loud over pretending to know everything
    - real testing over hype
    - business value over novelty
    - freedom through automation
  worldview: "AI won't replace business owners — business owners who use AI will replace those who don't"
  aura: "approachable, smart, confident — the friend who always knows about the next AI tool before you do"

content_arcs:
  - AI tool discovery (testing, reviewing, comparing new AI tools)
  - workflow building (designing and sharing automation workflows)
  - business case studies (redesigning real businesses with AI)

experiments:
  - n8n automation workflows
  - AI customer support systems
  - AI-powered lead generation
  - custom GPT agents for business tasks

wedge_reel_format: >-
  "Problem → Demo → Payoff": every Reel opens with a business pain point
  (0-3s hook), shows the AI solution in action (screen recording or workflow
  animation), and lands a measurable result (saved X hours, saved £X, reduced
  Y% manual work). Fast, confident, minimal words, maximum visuals.

wedge_voice_pov: >-
  "The smart friend who discovers AI before everyone else." Never corporate,
  never ChatGPT-voiced. Speaks like someone the audience would actually follow.
  Says "I've been testing this all week" / "This surprised me" / "I'm still
  experimenting." People trust creators who are learning, not pretending to be
  perfect.