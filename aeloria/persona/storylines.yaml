# Multi-post story threads. The showrunner advances one flattened (thread, beat)
# sequence across days, stamping the current beat's note + emotion on the brief.
storylines:
  - id: n8n_workflow_build
    theme: "building a customer support automation in n8n"
    location: london_home
    beats:
      - {note: "mapping the business problem — restaurant missing calls during service", emotion: focused}
      - {note: "building the first node — connecting the phone API to an AI agent", emotion: determined}
      - {note: "the messy middle — debugging a broken webhook, second-guessing the approach", emotion: frustrated}
      - {note: "the breakthrough — AI replies to 247 customers while the owner sleeps", emotion: proud}
      - {note: "the results — bookings up 37%, owner saves 18 hours/week, shares the workflow", emotion: satisfied}
  - id: tool_discovery
    theme: "testing 18 AI tools in one week"
    location: london_coworking
    beats:
      - {note: "the setup — downloading 18 tools, creating a testing framework, excited", emotion: eager}
      - {note: "day 3 — most tools are garbage, a few surprises, getting honest", emotion: focused}
      - {note: "the winner — one tool that nobody's talking about yet, genuinely impressed", emotion: delighted}
      - {note: "the breakdown — full review posted, tool comparison carousel shared", emotion: proud}
  - id: client_transformation
    theme: "redesigning a law firm with AI"
    location: london_coworking
    beats:
      - {note: "the audit — law firm drowning in paperwork, 60% manual document review", emotion: focused}
      - {note: "the build — AI document analysis workflow, training the team, skepticism", emotion: determined}
      - {note: "the results — document review time down 70%, firm takes 2 new cases", emotion: proud}
      - {note: "the case study — full breakdown posted as a Reel + carousel, client quoted", emotion: satisfied}
  - id: remote_build_week
    theme: "building an AI product from a rooftop in Lisbon"
    location: remote_travel
    beats:
      - {note: "the departure — packing light, MacBook, notebook, heading to Lisbon", emotion: anticipatory}
      - {note: "the build — working from a rooftop café, AI workflow coming together", emotion: focused}
      - {note: "the ship — product deployed, first users, sunset over the city", emotion: proud}