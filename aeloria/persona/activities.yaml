# AI entrepreneur activity library — day-in-the-life beats.
# Every activity keeps Aeloria recognizable: smart casual, MacBook, notebook,
# coffee, modern workspace, minimal aesthetic. Same female character.
# `indoor: true` marks interiors (offices, cafés, coworking, bedrooms, gyms).
activities:
  # --- founder_lifestyle ---
  - id: desk_workflow
    category: founder_lifestyle
    indoor: true
    subjects:
      - "at a clean desk with a MacBook showing an AI workflow, focused, typing"
      - "leaning back from the screen, processing an idea, coffee mug in hand"
    setting: "a minimal home office — clean white desk, MacBook, notebook, warm desk lamp, plant"
    mood: focused
    style_hint: film
    signal: true
    fits_locations: home_office
    format_affinity: [carousel, static]
