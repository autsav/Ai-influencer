# Influencer-life activity library — ~40 EARTHY day-in-the-life beats.
# Every activity keeps Aeloria recognizable: linen/knits, ceramic, wood, film
# camera, rustic/indie venues. shopping = farmers market, nightlife = candlelit
# wine bar, work = a cabin desk.
# `indoor: true` marks interiors (bathrooms, kitchens, vanities, gyms, café/bar
# interiors, studios, bedrooms); the beat sheet omits the OUTDOOR LOCATION_SCENE
# clause for these since `setting` already describes the interior. Omitted =>
# outdoor/ambiguous-outdoor (defaults false).
activities:
  # --- get_ready ---
  - id: grwm_makeup
    category: get_ready
    indoor: true
    subjects:
      - "at a mirror mid-makeup, a brush in hand, half-done and focused"
      - "leaning into the mirror doing her mascara, lips parted"
    setting: "a soft-lit vanity with scattered earthy-toned products and a linen towel"
    mood: focused_playful
    style_hint: selfie
    signal: true
    fits_locations: anywhere
    format_affinity: [carousel, static]
  - id: morning_skincare
    category: get_ready
    indoor: true
    subjects:
      - "patting in serum with damp skin, fresh-faced and calm"
      - "wrapped in a towel doing her skincare, dewy"
    setting: "a bright bathroom with plants and a ceramic dish of products"
